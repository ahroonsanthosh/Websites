<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070a" />
    <meta name="color-scheme" content="dark" />
    <title>Heloria Labs</title>
    <meta name="description" content="Heloria Labs. A software company in Ireland. We build our own software and run it ourselves." />
    <link rel="icon" href="data:," />

    <!-- With scripting off, nothing will ever reveal the content, so reveal it
         up front. A <noscript> <style> block only applies in that case, which
         is why the rule lives here rather than in the stylesheet. -->
    <noscript>
      <style>
        #main.is-offscreen {
          position: static;
          width: auto;
          height: auto;
          margin: 0;
          overflow: visible;
          clip-path: none;
          white-space: normal;
        }
        #webgl { display: none; }
      </style>
    </noscript>
  </head>
  <body>
    <!-- Single full-viewport WebGL surface. All future DOM/UI overlays sit above it.

         aria-hidden is correct here and is a decision, not an oversight: the
         canvas currently draws nothing, and every meaningful fact about this
         company lives in the <main> below, which is always in the accessibility
         tree. Revisit this the moment the canvas starts carrying information
         that has no HTML equivalent. The canvas has no tabindex, so it is not
         focusable and cannot trap keyboard users. -->
    <canvas id="webgl" aria-hidden="true"></canvas>

    <!-- The page's actual content. Present for assistive technology at all
         times, and visually offscreen while the experience is carrying it.
         The failure path removes `is-offscreen` so it becomes the page. -->
    <main id="main" class="content is-offscreen">
      <h1>Heloria Labs</h1>
      <p>A software company in Ireland.</p>
      <p>We build our own software and run it ourselves.</p>
      <p><a href="mailto:contact@helorialabs.com">contact@helorialabs.com</a></p>
    </main>

    <!-- Hidden until something fails. role="alert" so it is announced when it
         appears rather than waiting to be found. -->
    <div id="fatal" class="fatal" role="alert" hidden>
      <p id="fatal-message"></p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
