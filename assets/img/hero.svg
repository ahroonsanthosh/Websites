<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Dragon Jiu-Jitsu Academy training atmosphere">
  <defs>
    <radialGradient id="spot" cx="62%" cy="30%" r="75%">
      <stop offset="0" stop-color="#26262c"/>
      <stop offset="45%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5c95e"/><stop offset="1" stop-color="#b8862a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101014"/><stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#spot)"/>

  <!-- mat floor with perspective lines -->
  <rect y="640" width="1600" height="360" fill="url(#floor)"/>
  <g stroke="#1c1c22" stroke-width="2" opacity="0.8">
    <path d="M-200 1000 L720 640"/><path d="M120 1000 L780 640"/>
    <path d="M480 1000 L840 640"/><path d="M840 1000 L900 640"/>
    <path d="M1200 1000 L960 640"/><path d="M1560 1000 L1020 640"/>
    <path d="M1900 1000 L1080 640"/>
    <path d="M0 720 L1600 720" opacity="0.6"/>
    <path d="M0 820 L1600 820" opacity="0.4"/>
  </g>

  <!-- volumetric light beam -->
  <path d="M900 -50 L1300 -50 L1150 700 L1000 700 Z" fill="#e8b341" opacity="0.05" filter="url(#soft)"/>

  <!-- ghost dragon watermark -->
  <g opacity="0.06" transform="translate(600 150) scale(4.6)" fill="url(#gold)">
    <path d="M30 68 C20 58 24 42 40 38 C52 35 60 44 56 53 C53 60 44 60 40 53 C38 49 42 46 45 49 C43 47 40 49 41 53 C43 59 53 59 57 51 C62 41 52 30 38 33 C20 37 16 60 32 72 Z"/>
    <path d="M60 28 C70 23 82 28 84 40 C85 46 81 51 75 50 C79 46 78 40 73 39 C77 43 74 48 69 47 L74 53 L65 50 L69 56 L60 51 C54 47 53 37 60 28 Z"/>
    <path d="M66 24 C65 18 69 14 75 13 C71 18 72 23 70 26 Z"/>
  </g>

  <!-- gold rim accent lower left -->
  <ellipse cx="260" cy="760" rx="360" ry="60" fill="#e8b341" opacity="0.05" filter="url(#soft)"/>

  <text x="800" y="960" text-anchor="middle" font-family="Oswald, sans-serif" font-size="15" letter-spacing="5" fill="#4a4a4e">DRAGON JIU-JITSU ACADEMY · BALLINCOLLIG, CORK</text>
</svg>
