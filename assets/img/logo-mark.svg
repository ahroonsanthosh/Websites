    <circle cx="65.5" cy="38" r="1.8" fill="#0a0a0b"/>
    <!-- spikes on back -->
    <path d="M40 33 l3 -5 l2 5 z M47 32 l3 -5 l2 5 z M54 32 l3 -5 l2 5 z" opacity="0.9"/>
