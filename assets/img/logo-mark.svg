             C66 26 76 30 78 40
             C79 45 76 49 71 49
             C74 46 73 41 69 40
             C72 43 70 47 66 46
             L70 51 L63 49 L66 54 L59 50
             C54 47 53 39 58 30 Z"/>
    <!-- horns -->
    <path d="M64 27 C63 22 66 18 71 17 C68 21 69 25 67 28 Z"/>
    <path d="M70 28 C71 23 75 20 80 21 C76 24 75 28 73 30 Z"/>
