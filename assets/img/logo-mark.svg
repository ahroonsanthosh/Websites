      <stop offset="0" stop-color="#f5c95e"/>
      <stop offset="0.5" stop-color="#e8b341"/>
      <stop offset="1" stop-color="#b8862a"/>
    </linearGradient>
  </defs>
  <!-- outer ring -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="url(#g)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#g)" stroke-width="0.8" opacity="0.5"/>
